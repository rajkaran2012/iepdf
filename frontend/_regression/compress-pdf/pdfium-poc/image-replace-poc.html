<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>iePDF PDFium Image Replacement POC</title>
</head>
<body>
<pre id="output">Starting...</pre>

<script type="module">
import { init } from "@embedpdf/pdfium";

const output = document.getElementById("output");

function log(...args) {
  console.log(...args);
  output.textContent += args.join(" ") + "\n";
}

async function main() {
  log("=== PDFium Browser Image Replacement POC ===");

  const pdfUrl = "/C-04-image-heavy.pdf";

  const response = await fetch(pdfUrl);

  if (!response.ok) {
    throw new Error(
      `Failed to load PDF fixture: HTTP ${response.status}`
    );
  }

  const pdfBytes = new Uint8Array(
    await response.arrayBuffer()
  );

  log("Input PDF bytes:", pdfBytes.length);

  const pdfium = await init();

  log("PDFium wrapper initialized.");

  pdfium.PDFiumExt_Init();

  log("PDFiumExt_Init completed.");

  const mem = pdfium.pdfium.wasmExports;

  const pdfPtr = mem.malloc(pdfBytes.length);

  try {
    mem.writeBytes
      ? mem.writeBytes(pdfPtr, pdfBytes)
      : pdfBytes.forEach((value, index) => {
          pdfium.pdfium.setValue(
            pdfPtr + index,
            value,
            "i8"
          );
        });

    log("PDF copied into WASM memory.");

    const docPtr =
      pdfium.FPDF_LoadMemDocument(
        pdfPtr,
        pdfBytes.length,
        ""
      );

    if (!docPtr) {
      throw new Error(
        "FPDF_LoadMemDocument failed."
      );
    }

    log("Document loaded:", docPtr);

    try {
      const pageCount =
        pdfium.FPDF_GetPageCount(docPtr);

      log("Page count:", pageCount);

      const pagePtr =
        pdfium.FPDF_LoadPage(docPtr, 0);

      if (!pagePtr) {
        throw new Error(
          "FPDF_LoadPage failed."
        );
      }

      log("Page loaded:", pagePtr);

      try {
        const objectCount =
          pdfium.FPDFPage_CountObjects(
            pagePtr
          );

        log(
          "Page 0 object count:",
          objectCount
        );

        let imagePtr = 0;

        for (
          let i = 0;
          i < objectCount;
          i++
        ) {
          const objectPtr =
            pdfium.FPDFPage_GetObject(
              pagePtr,
              i
            );

          if (!objectPtr) continue;

          const type =
            pdfium.FPDFPageObj_GetType(
              objectPtr
            );

          log(
            `Object ${i}: type=${type}, ptr=${objectPtr}`
          );

          if (type === 3) {
            imagePtr = objectPtr;
            break;
          }
        }

        if (!imagePtr) {
          throw new Error(
            "No image object found."
          );
        }

        log(
          "Existing image object:",
          imagePtr
        );

        // ------------------------------------------------
        // Read existing image dimensions
        // ------------------------------------------------

        const widthPtr =
          mem.malloc(4);

        const heightPtr =
          mem.malloc(4);

        let width;
        let height;

        try {
          const ok =
            pdfium.FPDFImageObj_GetImagePixelSize(
              imagePtr,
              widthPtr,
              heightPtr
            );

          width =
            pdfium.pdfium.getValue(
              widthPtr,
              "i32"
            );

          height =
            pdfium.pdfium.getValue(
              heightPtr,
              "i32"
            );

          if (!ok) {
            throw new Error(
              "FPDFImageObj_GetImagePixelSize failed."
            );
          }
        } finally {
          mem.free(widthPtr);
          mem.free(heightPtr);
        }

        log(
          "Existing image size:",
          `${width} x ${height}`
        );

        // ------------------------------------------------
        // Read decoded pixels
        // ------------------------------------------------

        const decodedLength =
          pdfium.FPDFImageObj_GetImageDataDecoded(
            imagePtr,
            0,
            0
          );

        if (decodedLength <= 0) {
          throw new Error(
            `Invalid decoded image length: ${decodedLength}`
          );
        }

        log(
          "Decoded image bytes:",
          decodedLength
        );

        const decodedPtr =
          mem.malloc(decodedLength);

        let rgbaBytes;

        try {
          const actual =
            pdfium.FPDFImageObj_GetImageDataDecoded(
              imagePtr,
              decodedPtr,
              decodedLength
            );

          if (actual !== decodedLength) {
            log(
              "WARNING decoded size differs:",
              actual
            );
          }

          rgbaBytes =
            new Uint8Array(
              pdfium.pdfium.HEAPU8.buffer,
              decodedPtr,
              decodedLength
            ).slice();
        } catch (error) {
          /*
           * Some EmbedPDF builds do not expose HEAPU8
           * through the public runtime interface.
           *
           * Fall back to getValue().
           */
          rgbaBytes =
            new Uint8Array(decodedLength);

          for (
            let i = 0;
            i < decodedLength;
            i++
          ) {
            rgbaBytes[i] =
              pdfium.pdfium.getValue(
                decodedPtr + i,
                "i8"
              ) & 0xff;
          }
        } finally {
          mem.free(decodedPtr);
        }

        log(
          "Decoded pixel buffer copied."
        );

        // ------------------------------------------------
        // Browser-native JPEG encoding
        // ------------------------------------------------

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        if (!ctx) {
          throw new Error(
            "Could not create 2D canvas context."
          );
        }

        /*
         * PDFium's decoded image data for this fixture
         * is grayscale: 1800 * 1400 = 2,520,000 pixels
         * while the decoded buffer is 7,560,000 bytes.
         *
         * Therefore this POC explicitly checks the buffer
         * shape before interpreting it as RGB.
         */

        if (
          decodedLength !==
          width * height * 3
        ) {
          throw new Error(
            `Unexpected decoded format. Expected RGB24 (${width * height * 3}), got ${decodedLength}.`
          );
        }

        const rgba =
          new Uint8ClampedArray(
            width * height * 4
          );

        for (
          let src = 0, dst = 0;
          src < decodedLength;
          src += 3, dst += 4
        ) {
          rgba[dst] =
            rgbaBytes[src];

          rgba[dst + 1] =
            rgbaBytes[src + 1];

          rgba[dst + 2] =
            rgbaBytes[src + 2];

          rgba[dst + 3] =
            255;
        }

        const imageData =
          new ImageData(
            rgba,
            width,
            height
          );

        ctx.putImageData(
          imageData,
          0,
          0
        );

        const jpegBlob =
          await new Promise(
            (resolve, reject) => {
              canvas.toBlob(
                blob => {
                  if (blob) {
                    resolve(blob);
                  } else {
                    reject(
                      new Error(
                        "Canvas JPEG encoding returned null."
                      )
                    );
                  }
                },
                "image/jpeg",
                0.60
              );
            }
          );

        const jpegBytes =
          new Uint8Array(
            await jpegBlob.arrayBuffer()
          );

        log(
          "JPEG bytes:",
          jpegBytes.length
        );

        log(
          "JPEG compression:",
          `${((1 - jpegBytes.length / decodedLength) * 100).toFixed(2)}%`
        );

        // ------------------------------------------------
        // Allocate JPEG bytes in PDFium memory
        // ------------------------------------------------

        const jpegPtr =
          mem.malloc(
            jpegBytes.length
          );

        try {
          for (
            let i = 0;
            i < jpegBytes.length;
            i++
          ) {
            pdfium.pdfium.setValue(
              jpegPtr + i,
              jpegBytes[i],
              "i8"
            );
          }

          log(
            "JPEG copied into PDFium memory."
          );

          // ------------------------------------------------
          // Replace existing image
          // ------------------------------------------------

          const replaced =
            pdfium.EPDFImageObj_SetJpeg(
              pagePtr,
              0,
              imagePtr,
              jpegPtr,
              jpegBytes.length
            );

          log(
            "EPDFImageObj_SetJpeg result:",
            replaced
          );

          if (!replaced) {
            throw new Error(
              "EPDFImageObj_SetJpeg returned false."
            );
          }

          // ------------------------------------------------
          // Generate page content
          // ------------------------------------------------

          const generated =
            pdfium.FPDFPage_GenerateContent(
              pagePtr
            );

          log(
            "FPDFPage_GenerateContent:",
            generated
          );

          if (!generated) {
            throw new Error(
              "FPDFPage_GenerateContent failed."
            );
          }

          log(
            "=== IMAGE REPLACEMENT SUCCEEDED ==="
          );

        } finally {
          mem.free(jpegPtr);
        }

      } finally {
        pdfium.FPDF_ClosePage(pagePtr);
      }

      log(
        "NOTE: Save/reopen validation is the next stage."
      );

    } finally {
      pdfium.FPDF_CloseDocument(docPtr);
    }

  } finally {
    mem.free(pdfPtr);
  }
}

main().catch(error => {
  console.error(error);
  output.textContent +=
    "\nPOC FAILED:\n" +
    (error?.stack || error);
});
</script>
</body>
</html>
